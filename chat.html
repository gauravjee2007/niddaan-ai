<!DOCTYPE html>
<html>
<head>
  <title>NIDAAN – AI Assistant</title>
  <link rel="stylesheet" href="style.css">
  <script>
    if (localStorage.getItem("nidaan_auth") !== "yes") {
      location.href = "/login.html";
    }
  </script>
</head>
<body>

<header class="topbar">
  <img src="nidaan-logo.png" class="logo">
  <h1>NIDAAN – AI Assistant</h1>
</header>

<div id="chat" class="chat-box"></div>

<div class="input-bar">
  <input id="msg" placeholder="Type your question..">
  <button onclick="send()">➤</button>
</div>

<script src="app.js"></script>
</body>
</html>
