<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN Login</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2efe9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:white;
  padding:30px;
  width:360px;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,0.15);
}
h2{
  text-align:center;
  color:#2f5d50;
}
input, button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
}
button{
  background:#7acb73;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
#error{
  color:red;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>NIDAAN Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div id="error"></div>
</div>

<script>
/* Agar already login hai to direct chat */
if(localStorage.getItem("isLoggedIn")==="true"){
  window.location.href="/chat/";
}

function login(){
  const u=document.getElementById("user").value;
  const p=document.getElementById("pass").value;

  if(u==="admin" && p==="password"){
    localStorage.setItem("isLoggedIn","true");
    window.location.href="/chat/";
  }else{
    document.getElementById("error").innerText="Invalid credentials";
  }
}
</script>

</body>
</html>
