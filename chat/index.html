<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN – AI Assistant</title>

<script>
/* 🔐 AUTH GUARD */
if(localStorage.getItem("isLoggedIn")!=="true"){
  window.location.href="/";
}
</script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f7fa;
}
header{
  background:#263e4a;
  color:white;
  padding:20px;
  text-align:center;
  font-size:22px;
}
.chat-box{
  max-width:900px;
  margin:40px auto;
  background:white;
  border-radius:10px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
.logout{
  position:fixed;
  top:15px;
  right:20px;
  padding:8px 14px;
  border:none;
  background:#e74c3c;
  color:white;
  cursor:pointer;
  border-radius:5px;
}
</style>
</head>

<body>

<button class="logout" onclick="logout()">Logout</button>

<header>NIDAAN – AI Assistant</header>

<div class="chat-box">
  <p><b>Hello 👋</b></p>
  <p>I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.</p>
  <p>How may I help you?</p>
</div>

<script>
function logout(){
  localStorage.removeItem("isLoggedIn");
  window.location.href="/";
}
</script>

</body>
</html>
